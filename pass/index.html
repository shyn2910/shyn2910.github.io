<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trình Tạo Mật Khẩu | ShynSuite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font + Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: radial-gradient(circle at top, #15161e, #05050b 60%, #000 100%);
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.1fr 1.3fr;
            gap: 24px;
        }

        .card {
            background: rgba(15, 23, 42, 0.95);
            border-radius: 18px;
            padding: 24px 26px;
            box-shadow:
                0 0 25px rgba(248, 250, 252, 0.04),
                0 0 35px rgba(59, 130, 246, 0.20);
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-header-left i {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #22c55e 0%, #16a34a 40%, transparent 80%);
            color: #22c55e;
            box-shadow: 0 0 18px rgba(34, 197, 94, 0.7);
            font-size: 0.9rem;
        }

        .btn-ghost {
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.55);
            padding: 8px 14px;
            font-size: 0.85rem;
            background: rgba(15, 23, 42, 0.9);
            color: #e5e7eb;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .btn-ghost i {
            font-size: 0.85rem;
        }

        .btn-ghost:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
            color: #f9fafb;
        }

        .section-label {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .row {
            margin-bottom: 18px;
        }

        /* Slider line */
        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-wrap input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            outline: none;
        }

        .slider-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #f9fafb;
            border: 2px solid #22c55e;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.9);
            cursor: pointer;
        }

        .slider-value {
            min-width: 34px;
            text-align: right;
            font-weight: 600;
            color: #f9fafb;
        }

        .check-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
            accent-color: #22c55e;
        }

        .checkbox-item span {
            user-select: none;
        }

        .number-input {
            width: 100%;
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            background: rgba(15, 23, 42, 0.95);
            color: #f9fafb;
            outline: none;
            font-size: 0.9rem;
        }

        .number-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.45);
        }

        .btn-main {
            margin-top: 6px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            box-shadow:
                0 0 16px rgba(34, 197, 94, 0.7),
                0 0 32px rgba(22, 163, 74, 0.9);
            color: #052e16;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.02em;
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
        }

        .btn-main i {
            font-size: 0.9rem;
        }

        .btn-main:hover {
            filter: brightness(1.07);
            transform: translateY(-1px);
        }

        .btn-main:active {
            transform: translateY(1px) scale(0.98);
            box-shadow:
                0 0 10px rgba(34, 197, 94, 0.35),
                0 0 18px rgba(22, 163, 74, 0.5);
        }

        /* Result panel */
        .strength-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .strength-badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .strength-weak {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        .strength-medium {
            background: rgba(249, 115, 22, 0.12);
            color: #fed7aa;
            border: 1px solid rgba(249, 115, 22, 0.5);
        }

        .strength-strong {
            background: rgba(34, 197, 94, 0.12);
            color: #bbf7d0;
            border: 1px solid rgba(34, 197, 94, 0.5);
        }

        .result-box {
            width: 100%;
            height: 260px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.06), rgba(15, 23, 42, 0.96));
            color: #e5e7eb;
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.86rem;
            resize: none;
            outline: none;
            white-space: pre;
        }

        .result-box::placeholder {
            color: #6b7280;
        }

        .note {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .note i {
            font-size: 0.8rem;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: rgba(15, 23, 42, 0.96);
            border-radius: 999px;
            padding: 8px 14px;
            border: 1px solid rgba(56, 189, 248, 0.7);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.7);
            font-size: 0.8rem;
            color: #e5e7eb;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 999;
        }

        .toast i {
            color: #38bdf8;
        }

        @media (max-width: 900px) {
            .wrapper {
                grid-template-columns: 1fr;
                max-width: 600px;
            }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <!-- CÀI ĐẶT -->
    <div class="card">
        <div class="card-header">
            <div class="card-header-left">
                <i class="fas fa-gear"></i>
                <span class="card-title">Cài Đặt</span>
            </div>
        </div>

        <!-- Độ dài mật khẩu -->
        <div class="row">
            <div class="section-label">Độ Dài Mật Khẩu: <strong id="lengthLabel">16</strong></div>
            <div class="slider-wrap">
                <input type="range" id="lengthRange" min="6" max="64" value="16">
            </div>
        </div>

        <!-- Loại ký tự -->
        <div class="row">
            <div class="section-label">Loại Ký Tự</div>
            <div class="check-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="uppercase" checked>
                    <span>Chữ Hoa (A-Z)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="lowercase" checked>
                    <span>Chữ Thường (a-z)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="numbers" checked>
                    <span>Số (0-9)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="symbols" checked>
                    <span>Ký Tự Đặc Biệt (!@#$%^&*)</span>
                </label>
            </div>
        </div>

        <!-- Số lượng mật khẩu -->
        <div class="row">
            <div class="section-label">Số Lượng Mật Khẩu</div>
            <input type="number" id="quantity" class="number-input" min="1" max="100" value="10">
        </div>

        <button class="btn-main" id="generateBtn">
            <i class="fas fa-wand-magic-sparkles"></i>
            <span>Tạo Mật Khẩu</span>
        </button>
    </div>

    <!-- KẾT QUẢ -->
    <div class="card">
        <div class="card-header">
            <div class="card-header-left">
                <i class="fas fa-shield-halved"></i>
                <span class="card-title">Kết Quả</span>
            </div>
            <button class="btn-ghost" id="copyAllBtn">
                <i class="far fa-clipboard"></i>
                <span>Sao Chép Tất Cả</span>
            </button>
        </div>

        <div class="strength-row">
            <span class="section-label">Độ Mạnh Mật Khẩu</span>
            <span id="strengthBadge" class="strength-badge strength-strong">Mạnh</span>
        </div>

        <textarea id="resultBox" class="result-box" readonly
                  placeholder="Danh sách mật khẩu sẽ hiển thị tại đây...&#10;Nhấn &quot;Tạo Mật Khẩu&quot; để bắt đầu."></textarea>

        <div class="note">
            <i class="fas fa-circle-info"></i>
            <span>Mỗi mật khẩu nằm trên một dòng. Hãy lưu trữ nơi an toàn và không chia sẻ cho người khác.</span>
        </div>
    </div>
</div>

<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span>Đã sao chép vào clipboard!</span>
</div>

<script>
    const lengthRange = document.getElementById('lengthRange');
    const lengthLabel = document.getElementById('lengthLabel');
    const uppercaseCheckbox = document.getElementById('uppercase');
    const lowercaseCheckbox = document.getElementById('lowercase');
    const numbersCheckbox = document.getElementById('numbers');
    const symbolsCheckbox = document.getElementById('symbols');
    const quantityInput = document.getElementById('quantity');
    const generateBtn = document.getElementById('generateBtn');
    const resultBox = document.getElementById('resultBox');
    const strengthBadge = document.getElementById('strengthBadge');
    const copyAllBtn = document.getElementById('copyAllBtn');
    const toast = document.getElementById('toast');

    // Cập nhật label khi kéo slider
    lengthRange.addEventListener('input', () => {
        lengthLabel.textContent = lengthRange.value;
        updateStrengthBadge();
    });

    // Hàm đánh giá độ mạnh (dạng đơn giản)
    function updateStrengthBadge() {
        const length = parseInt(lengthRange.value, 10);
        let types = 0;
        if (uppercaseCheckbox.checked) types++;
        if (lowercaseCheckbox.checked) types++;
        if (numbersCheckbox.checked) types++;
        if (symbolsCheckbox.checked) types++;

        let level, cls;
        if (length < 8 || types <= 1) {
            level = 'Yếu';
            cls = 'strength-weak';
        } else if ((length >= 8 && length < 12 && types >= 2) || (length >= 12 && types === 2)) {
            level = 'Trung Bình';
            cls = 'strength-medium';
        } else {
            level = 'Mạnh';
            cls = 'strength-strong';
        }

        strengthBadge.textContent = level;
        strengthBadge.classList.remove('strength-weak', 'strength-medium', 'strength-strong');
        strengthBadge.classList.add(cls);
    }

    // Hàm tạo một mật khẩu
    function generateSinglePassword(len, options) {
        let chars = '';
        if (options.upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if (options.lower) chars += 'abcdefghijklmnopqrstuvwxyz';
        if (options.num) chars += '0123456789';
        if (options.sym) chars += '!@#$%^&*()-_=+[]{};:,.<>/?';

        if (!chars) return '';

        let password = '';
        const array = new Uint32Array(len);
        window.crypto.getRandomValues(array);
        for (let i = 0; i < len; i++) {
            const index = array[i] % chars.length;
            password += chars.charAt(index);
        }
        return password;
    }

    // Tạo danh sách mật khẩu
    generateBtn.addEventListener('click', () => {
        const length = parseInt(lengthRange.value, 10);
        let quantity = parseInt(quantityInput.value, 10);

        if (isNaN(quantity) || quantity < 1) quantity = 1;
        if (quantity > 100) quantity = 100;
        quantityInput.value = quantity;

        const options = {
            upper: uppercaseCheckbox.checked,
            lower: lowercaseCheckbox.checked,
            num: numbersCheckbox.checked,
            sym: symbolsCheckbox.checked
        };

        if (!options.upper && !options.lower && !options.num && !options.sym) {
            alert('Vui lòng chọn ít nhất 1 loại ký tự!');
            return;
        }

        const list = [];
        for (let i = 0; i < quantity; i++) {
            list.push(generateSinglePassword(length, options));
        }
        resultBox.value = list.join('\n');

        updateStrengthBadge();
    });

    // Sao chép tất cả
    copyAllBtn.addEventListener('click', () => {
        const text = resultBox.value.trim();
        if (!text) return;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(showToast);
        } else {
            // fallback
            resultBox.select();
            document.execCommand('copy');
            showToast();
        }
    });

    function showToast() {
        toast.style.display = 'flex';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 1500);
    }

    // Khởi tạo
    updateStrengthBadge();
</script>
</body>
</html>
