<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Số Ngẫu Nhiên</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font + Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #05070a;
            color: #e5e7eb;
            min-height: 100vh;
        }
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 16px 32px;
        }
        /* breadcrumb + title */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .breadcrumb span,
        .breadcrumb a {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .breadcrumb a {
            color: #9ca3af;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            color: #e5e7eb;
        }
        .breadcrumb i {
            font-size: 0.75rem;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        header p {
            font-size: 0.95rem;
            color: #9ca3af;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1.1fr 1.1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #0b1120;
            border-radius: 18px;
            border: 1px solid rgba(55,65,81,0.9);
            box-shadow:
                0 0 25px rgba(15,23,42,0.9),
                0 0 30px rgba(34,197,94,0.08);
            padding: 18px 20px 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-header-left i {
            width: 26px;
            height: 26px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.12);
            color: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .card-title {
            font-weight: 600;
        }

        .btn-ghost {
            border-radius: 999px;
            border: 1px solid rgba(148,163,184,0.5);
            background: #020617;
            color: #e5e7eb;
            padding: 7px 13px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-ghost i {
            font-size: 0.85rem;
        }
        .btn-ghost:hover {
            border-color: #22c55e;
            box-shadow: 0 0 14px rgba(34,197,94,0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field label {
            font-size: 0.85rem;
            color: #9ca3af;
        }
        .field input[type="number"] {
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid rgba(75,85,99,0.9);
            background: #020617;
            color: #e5e7eb;
            outline: none;
            font-size: 0.9rem;
        }
        .field input[type="number"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56,189,248,0.45);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.88rem;
            user-select: none;
        }
        .checkbox-row input {
            width: 16px;
            height: 16px;
            accent-color: #22c55e;
        }

        .multi-options {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }

        .btn-main {
            width: 100%;
            padding: 11px 14px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(90deg,#22c55e,#16a34a);
            color: #052e16;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow:
                0 0 16px rgba(34,197,94,0.7),
                0 0 30px rgba(22,163,74,0.8);
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
        }
        .btn-main i {
            font-size: 0.9rem;
        }
        .btn-main:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }
        .btn-main:active {
            transform: translateY(1px) scale(0.98);
            box-shadow:
                0 0 10px rgba(34,197,94,0.35),
                0 0 16px rgba(22,163,74,0.5);
        }

        /* Result card */
        .result-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 10px;
            min-height: 140px;
        }
        .result-number {
            font-size: 3rem;
            font-weight: 700;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(34,197,94,0.9);
        }
        .result-sub {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .history {
            margin-top: 10px;
            border-top: 1px solid rgba(31,41,55,0.9);
            padding-top: 8px;
        }
        .history-title {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        .history-list {
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.8rem;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.5;
            color: #e5e7eb;
            white-space: pre-line;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }
        .toast {
            min-width: 230px;
            background: #020617;
            border-radius: 12px;
            border: 1px solid rgba(34,197,94,0.6);
            color: #e5e7eb;
            padding: 10px 12px;
            font-size: 0.8rem;
            box-shadow: 0 0 16px rgba(34,197,94,0.7);
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .toast i {
            color: #22c55e;
            margin-top: 2px;
        }
        .toast-close {
            margin-left: auto;
            cursor: pointer;
            color: #6b7280;
        }
        .toast-close:hover {
            color: #f9fafb;
        }
        .toast-title {
            font-weight: 600;
        }
        .toast-desc {
            color: #9ca3af;
        }

        @media (max-width: 900px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .result-number {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="breadcrumb">
        <span><i class="fa-solid fa-house"></i> Trang chủ</span>
        <i class="fa-solid fa-angle-right"></i>
        <span>Công cụ miễn phí</span>
        <i class="fa-solid fa-angle-right"></i>
        <span>Tạo Số Ngẫu Nhiên</span>
    </div>

    <header>
        <h1>Tạo Số Ngẫu Nhiên</h1>
        <p>Tạo số ngẫu nhiên trong một khoảng chỉ định. Hỗ trợ tạo một hoặc nhiều số với tùy chọn kiểm soát trùng lặp.</p>
    </header>

    <div class="content-grid">
        <!-- CÀI ĐẶT -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-left">
                    <i class="fa-solid fa-gear"></i>
                    <span class="card-title">Cài Đặt</span>
                </div>
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="minValue">Giá Trị Tối Thiểu</label>
                    <input type="number" id="minValue" value="1">
                </div>
                <div class="field">
                    <label for="maxValue">Giá Trị Tối Đa</label>
                    <input type="number" id="maxValue" value="100">
                </div>
            </div>

            <label class="checkbox-row">
                <input type="checkbox" id="multipleToggle">
                <span>Tạo Nhiều Số</span>
            </label>

            <div class="multi-options" id="multiOptions">
                <div class="field">
                    <label for="quantity">Số lượng</label>
                    <input type="number" id="quantity" value="5" min="1" max="1000">
                </div>
                <div class="field">
                    <label for="uniqueToggle">Tùy chọn</label>
                    <label class="checkbox-row" style="margin: 0;">
                        <input type="checkbox" id="uniqueToggle">
                        <span>Không trùng lặp</span>
                    </label>
                </div>
            </div>

            <button class="btn-main" id="generateBtn">
                <i class="fa-solid fa-shuffle"></i>
                <span>Tạo Số</span>
            </button>
        </div>

        <!-- KẾT QUẢ -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-left">
                    <i class="fa-solid fa-hashtag"></i>
                    <span class="card-title">Kết Quả</span>
                </div>
                <button class="btn-ghost" id="copyResultBtn">
                    <i class="fa-regular fa-clipboard"></i>
                    Sao Chép
                </button>
            </div>

            <div class="result-main">
                <div id="resultNumber" class="result-number">–</div>
                <div class="result-sub" id="resultSummary">Chưa tạo số nào.</div>
            </div>

            <div class="history">
                <div class="history-title">Lịch sử gần đây</div>
                <div class="history-list" id="historyList">
                    (trống)
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
    const minInput = document.getElementById('minValue');
    const maxInput = document.getElementById('maxValue');
    const multipleToggle = document.getElementById('multipleToggle');
    const multiOptions = document.getElementById('multiOptions');
    const quantityInput = document.getElementById('quantity');
    const uniqueToggle = document.getElementById('uniqueToggle');
    const generateBtn = document.getElementById('generateBtn');

    const resultNumber = document.getElementById('resultNumber');
    const resultSummary = document.getElementById('resultSummary');
    const historyList = document.getElementById('historyList');
    const copyResultBtn = document.getElementById('copyResultBtn');

    const toastContainer = document.getElementById('toastContainer');

    multipleToggle.addEventListener('change', () => {
        if (multipleToggle.checked) {
            multiOptions.style.display = 'grid';
        } else {
            multiOptions.style.display = 'none';
        }
    });

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function showToast(title, desc) {
        const toast = document.createElement('div');
        toast.className = 'toast';

        toast.innerHTML = `
            <i class="fa-solid fa-check"></i>
            <div>
                <div class="toast-title">${title}</div>
                <div class="toast-desc">${desc}</div>
            </div>
            <span class="toast-close"><i class="fa-solid fa-xmark"></i></span>
        `;

        toast.querySelector('.toast-close').addEventListener('click', () => {
            toastContainer.removeChild(toast);
        });

        toastContainer.appendChild(toast);

        setTimeout(() => {
            if (toast.parentElement) {
                toastContainer.removeChild(toast);
            }
        }, 3000);
    }

    function updateHistory(newLine) {
        if (historyList.textContent.trim() === '(trống)') {
            historyList.textContent = newLine;
        } else {
            historyList.textContent = newLine + '\n' + historyList.textContent;
        }
        // giới hạn 100 dòng
        const lines = historyList.textContent.split('\n');
        if (lines.length > 100) {
            historyList.textContent = lines.slice(0, 100).join('\n');
        }
    }

    generateBtn.addEventListener('click', () => {
        let min = parseInt(minInput.value, 10);
        let max = parseInt(maxInput.value, 10);

        if (isNaN(min) || isNaN(max)) {
            alert('Vui lòng nhập giá trị tối thiểu và tối đa hợp lệ.');
            return;
        }

        if (min > max) {
            [min, max] = [max, min]; // tự động hoán đổi
            minInput.value = min;
            maxInput.value = max;
        }

        if (!multipleToggle.checked) {
            // tạo 1 số
            const value = randomInt(min, max);
            resultNumber.textContent = value;
            resultSummary.textContent = 'Đã tạo 1 số.';
            updateHistory(`1 số: ${value}`);
            showToast('Tạo số thành công', 'Đã tạo 1 số');
        } else {
            let quantity = parseInt(quantityInput.value, 10);
            if (isNaN(quantity) || quantity < 1) quantity = 1;
            if (quantity > 1000) quantity = 1000;
            quantityInput.value = quantity;

            const unique = uniqueToggle.checked;
            const range = max - min + 1;

            if (unique && quantity > range) {
                alert('Không thể tạo số không trùng lặp: Số lượng lớn hơn khoảng giá trị.');
                return;
            }

            const resultArr = [];
            if (unique) {
                const all = [];
                for (let v = min; v <= max; v++) all.push(v);
                for (let i = 0; i < quantity; i++) {
                    const idx = randomInt(0, all.length - 1);
                    resultArr.push(all[idx]);
                    all.splice(idx, 1);
                }
            } else {
                for (let i = 0; i < quantity; i++) {
                    resultArr.push(randomInt(min, max));
                }
            }

            if (resultArr.length > 0) {
                resultNumber.textContent = resultArr[0];
            } else {
                resultNumber.textContent = '–';
            }

            resultSummary.textContent = `Đã tạo ${resultArr.length} số${unique ? ' (không trùng)' : ''}.`;
            updateHistory(`${resultArr.length} số: ${resultArr.join(', ')}`);
            showToast('Tạo số thành công', `Đã tạo ${resultArr.length} số`);
        }
    });

    copyResultBtn.addEventListener('click', () => {
        const text = historyList.textContent.trim() || resultNumber.textContent.trim();
        if (!text || text === '–' || text === '(trống)') return;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Đã sao chép', 'Kết quả đã được sao chép vào clipboard.');
            });
        } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('Đã sao chép', 'Kết quả đã được sao chép vào clipboard.');
        }
    });
</script>
</body>
</html>
